<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Espace orga · Cagnotte</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛠️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Familjen+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#ECEAFF;--paper:#FBFAFF;--ink:#16197A;--muted:#565AA3;--rail:#CCC9F3;--hot:#D41E5E;--sun:#FFD93B;--ok:#0E7A4F;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0D0F45;--paper:#161A5C;--ink:#ECEAFF;--muted:#A3A7E6;--rail:#2C3083;--hot:#FF5C93;--ok:#5FE0A6;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0D0F45;--paper:#161A5C;--ink:#ECEAFF;--muted:#A3A7E6;--rail:#2C3083;--hot:#FF5C93;--ok:#5FE0A6;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.45 "Familjen Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:56rem;margin:0 auto;padding:1.25rem}
h1,h2,.big{font-family:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;font-weight:800;line-height:1;margin:0}
h1{font-size:2.5rem}
h2{font-size:1.75rem;margin-bottom:.75rem}
p{margin:.25rem 0 .75rem}
.muted{color:var(--muted)}
.card{background:var(--paper);border:1px solid var(--rail);border-radius:14px;padding:1.1rem 1.2rem;margin-top:1.25rem}
label{display:flex;flex-direction:column;gap:.2rem;font-size:.9rem;font-weight:500}
input,textarea{font:inherit;color:inherit;background:var(--bg);border:2px solid var(--rail);border-radius:8px;padding:.45rem .6rem;min-width:0;width:100%}
textarea{resize:vertical;min-height:4.5rem}
input[type=checkbox]{width:1.15rem;height:1.15rem;accent-color:var(--hot)}
input:focus,textarea:focus{border-color:var(--ink);outline:none}
:focus-visible{outline:3px solid var(--hot);outline-offset:2px}
button{font:inherit;font-weight:700;border-radius:8px;padding:.5rem .95rem;cursor:pointer;border:2px solid var(--ink);background:var(--ink);color:var(--bg)}
button.ghost{background:transparent;color:var(--ink)}
button.danger{background:transparent;color:var(--hot);border-color:var(--hot)}
button.sm{padding:.15rem .55rem;font-size:.85rem}
button:disabled{opacity:.5;cursor:progress}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:flex-end}
.row > label{flex:1 1 10rem}
.row > label.n{flex:0 1 8rem}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:1rem;flex-wrap:wrap}
.total{font-family:"Big Shoulders Display",Impact,sans-serif;font-weight:900;font-size:clamp(3.5rem,14vw,6rem);line-height:.9;background:var(--sun);color:#16197A;padding:.4rem .8rem;border-radius:10px;display:inline-block}
.status{position:sticky;bottom:0;margin-top:1rem;padding:.6rem 1rem;border-radius:10px;background:var(--ink);color:var(--bg);font-weight:500;min-height:1rem}
.status:empty{display:none}
.status.err{background:var(--hot);color:#fff}
.tabs{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:1.25rem}
.tabs button{background:transparent;color:var(--ink);border-radius:999px;padding:.3rem .95rem}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.dirty{color:var(--hot);font-weight:700;font-size:.9rem}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;gap:.75rem;align-items:center;justify-content:space-between;padding:.5rem 0;border-bottom:1px solid var(--rail)}
.list .when{color:var(--muted);font-size:.85rem}
.grid{display:flex;flex-direction:column}
.it{display:grid;grid-template-columns:6.5rem 1fr auto auto auto;gap:.45rem .6rem;align-items:center;padding:.2rem 0}
.c .it{grid-template-columns:6.5rem 1fr 1fr auto}
.it.h{font-size:.8rem;font-weight:700;color:var(--muted)}
.chk{display:flex;flex-direction:row;align-items:center;gap:.3rem;font-size:.85rem;white-space:nowrap}
.warn{background:var(--sun);color:#16197A;border-radius:8px;padding:.5rem .75rem;font-size:.9rem;margin:.5rem 0}
.warn:empty{display:none}
@media (max-width:640px){
  .it{grid-template-columns:5.5rem auto auto 1fr;padding:.6rem 0;border-bottom:1px solid var(--rail)}
  .it .txt{grid-column:2/-1}
  .it .del{grid-column:4;justify-self:end}
  .it.h{display:none}
  .c .it{grid-template-columns:5.5rem 1fr auto}
  .c .it .note{grid-column:1/-1;grid-row:2}
  .c .it .del{grid-column:3;grid-row:1}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="head"><h1>Espace orga</h1><a href="./" target="_blank" rel="noopener" style="color:inherit">Voir la page publique ↗</a></div>
  <section id="login" class="card" aria-labelledby="lt">
    <h2 id="lt">Connexion</h2>
    <p class="muted">Colle ton jeton GitHub (il reste sur cet appareil uniquement). Sans jeton, cette page ne peut rien modifier.</p>
    <div class="row">
      <label>Jeton GitHub<input id="tok" type="password" autocomplete="off" placeholder="github_pat_…"></label>
      <label class="n">Dépôt<input id="repo" value="MadaCS/cagnotte-streamada"></label>
      <label class="n">Branche<input id="branch" value="main"></label>
      <button id="go" type="button">Se connecter</button>
    </div>
  </section>
  <div id="ui" hidden></div>
  <div id="status" class="status" role="status" aria-live="polite"></div>
</div>
<script>
(function(){
const $ = id => document.getElementById(id);
const el = (tag, cls, text) => { const e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e; };
const num = v => { const n = Number(String(v).replace(',','.')); return isFinite(n) ? n : 0; };
const eur = n => Number(n).toLocaleString('fr-FR',{maximumFractionDigits:2})+' €';
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const clone = o => JSON.parse(JSON.stringify(o));
const store = { get(k){ try{return localStorage.getItem(k);}catch(e){return null;} }, set(k,v){ try{localStorage.setItem(k,v);}catch(e){} }, del(k){ try{localStorage.removeItem(k);}catch(e){} } };

let cfg = null, data = null, sha = null, busy = false, tab = 'dons';
const draft = { paliers:null, carte:null, textes:null };
const dirty = { paliers:false, carte:false, textes:false };

function status(msg, err){ const s=$('status'); s.textContent = msg||''; s.className = 'status'+(err?' err':''); if(msg && !err) setTimeout(()=>{ if(s.textContent===msg) s.textContent=''; }, 6000); }
const total = d => Math.round((d.dons.reduce((s,x)=>s+num(x.a),0) + num(d.ajustement))*100)/100;

function normalize(d){
  d = d && typeof d==='object' ? d : {};
  d.dons = Array.isArray(d.dons)?d.dons:[]; d.paliers = Array.isArray(d.paliers)?d.paliers:[]; d.carte = Array.isArray(d.carte)?d.carte:[];
  d.objectif = d.objectif||{montant:1000,texte:''}; d.ajustement = num(d.ajustement); d.trancheMada = d.trancheMada==null?50:num(d.trancheMada);
  d.paliers.forEach(p=>{ if(!p.id) p.id=uid('p'); }); d.carte.forEach(c=>{ if(!c.id) c.id=uid('c'); }); d.dons.forEach(x=>{ if(!x.id) x.id=uid('d'); });
  return d;
}

// GitHub API
const b64enc = str => { const b = new TextEncoder().encode(str); let s=''; for(let i=0;i<b.length;i+=0x8000) s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000)); return btoa(s); };
const b64dec = b64 => new TextDecoder().decode(Uint8Array.from(atob(b64.replace(/\s/g,'')), c=>c.charCodeAt(0)));
const api = (path, opt={}) => fetch('https://api.github.com/repos/'+cfg.repo+path, {cache:'no-store', ...opt,
  headers:{'Accept':'application/vnd.github+json','Authorization':'Bearer '+cfg.token,'X-GitHub-Api-Version':'2022-11-28',...(opt.headers||{})}});
function apiError(r){
  if(r.status===401) return 'Jeton invalide ou expiré.';
  if(r.status===403) return 'Ce jeton n’a pas le droit de modifier le dépôt (il faut « Contents : Read and write »).';
  if(r.status===404) return 'Dépôt ou fichier data.json introuvable. Vérifie le nom du dépôt et que data.json est bien envoyé.';
  return 'Erreur GitHub ('+r.status+').';
}
async function pull(){
  const r = await api('/contents/data.json?ref='+encodeURIComponent(cfg.branch));
  if(!r.ok) throw new Error(apiError(r));
  const j = await r.json();
  return { d: normalize(JSON.parse(b64dec(j.content))), sha: j.sha };
}
async function push(d, s, msg){
  const r = await api('/contents/data.json', {method:'PUT', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({message: msg, content: b64enc(JSON.stringify(d,null,1)), sha: s, branch: cfg.branch})});
  if(r.status===409 || r.status===422) { const e=new Error('conflict'); e.conflict=true; throw e; }
  if(!r.ok) throw new Error(apiError(r));
  return (await r.json()).content.sha;
}
// Always re-reads the latest file, applies one change, saves. Retries on conflict.
async function commit(mut, msg){
  if(busy) return false; busy = true; setBusy(true); status('Enregistrement…');
  try{
    for(let attempt=0; attempt<3; attempt++){
      const cur = await pull();
      mut(cur.d); cur.d.maj = Date.now();
      try{ sha = await push(cur.d, cur.sha, msg); data = cur.d; break; }
      catch(e){ if(!e.conflict || attempt===2) throw e; }
    }
    resetClean(); render(); status('Enregistré. La page publique suivra d’ici 1 à 5 minutes.');
    return true;
  }catch(e){ status(e.message==='conflict'?'Conflit avec un autre orga, réessaie.':e.message, true); return false; }
  finally{ busy = false; setBusy(false); }
}
function setBusy(b){ document.querySelectorAll('#ui button').forEach(x=>x.disabled=b); }
function resetClean(){
  if(!dirty.paliers) draft.paliers = clone(data.paliers);
  if(!dirty.carte) draft.carte = clone(data.carte);
  if(!dirty.textes) draft.textes = {intro:data.intro||'', obj:num(data.objectif.montant), objt:data.objectif.texte||'', tranche:data.trancheMada};
}

async function connect(){
  cfg = { token: $('tok').value.trim(), repo: $('repo').value.trim().replace(/^https?:\/\/github\.com\//,'').replace(/\.git$/,''), branch: $('branch').value.trim()||'main' };
  if(!cfg.token){ status('Colle d’abord ton jeton GitHub.', true); return; }
  $('go').disabled = true; status('Connexion…');
  try{
    const p = await pull(); data = p.d; sha = p.sha;
    store.set('cg_token', cfg.token); store.set('cg_repo', cfg.repo); store.set('cg_branch', cfg.branch);
    $('login').hidden = true; $('ui').hidden = false; resetClean(); render(); status('Connecté.');
    setInterval(refresh, 30000);
  }catch(e){ status(e.message, true); }
  $('go').disabled = false;
}
async function refresh(){
  if(busy || document.hidden) return;
  try{ const p = await pull(); if(p.sha!==sha){ data=p.d; sha=p.sha; resetClean(); render(); } }catch(e){}
}

function render(){
  const ui = $('ui'); const keep = document.activeElement && document.activeElement.id; const y = window.scrollY;
  ui.textContent = '';
  const head = el('div','card');
  const hh = el('div','head');
  const left = el('div'); left.append(el('div','muted','Total affiché'), el('div','total',eur(total(data))));
  const right = el('div'); const lo = el('button','ghost sm','Se déconnecter'); lo.type='button';
  lo.onclick=()=>{ store.del('cg_token'); location.reload(); };
  right.append(el('div','muted',data.dons.length+' dons · '+(data.maj?'màj '+new Date(data.maj).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}):'')), lo);
  hh.append(left,right); head.append(hh); ui.append(head);

  const tabs = el('div','tabs'); tabs.setAttribute('role','tablist');
  [['dons','Dons'],['paliers','Paliers'],['carte','À la carte'],['textes','Textes']].forEach(([k,l])=>{
    const b = el('button',null,l+(dirty[k]?' •':'')); b.type='button'; b.setAttribute('role','tab'); b.setAttribute('aria-selected',String(tab===k));
    b.onclick=()=>{ tab=k; render(); }; tabs.append(b);
  });
  ui.append(tabs);
  ui.append(({dons:viewDons, paliers:viewPaliers, carte:viewCarte, textes:viewTextes})[tab]());
  if(keep && $(keep)) $(keep).focus();
  window.scrollTo(0,y);
}

function viewDons(){
  const c = el('section','card');
  c.append(el('h2',null,'Ajouter un don'));
  const r = el('div','row');
  const l1 = el('label',null,'Pseudo'); const n = el('input'); n.id='dn'; n.placeholder='Anonyme'; n.maxLength=40; l1.append(n);
  const l2 = el('label','n','Montant (€)'); const a = el('input'); a.id='da'; a.inputMode='decimal'; a.placeholder='10'; l2.append(a);
  const b = el('button',null,'Ajouter le don'); b.type='button';
  const add = async()=>{ const v=Math.round(num(a.value)*100)/100; if(!(v>0)){ status('Indique un montant supérieur à 0.', true); a.focus(); return; }
    const name=n.value.trim().slice(0,40);
    if(await commit(d=>d.dons.push({id:uid('d'),n:name,a:v,t:Date.now()}), 'Don '+v+' € '+(name||'anonyme'))){ $('dn')&&($('dn').value=''); $('da')&&($('da').value=''); $('dn')&&$('dn').focus(); } };
  b.onclick=add; [n,a].forEach(i=>i.addEventListener('keydown',e=>{ if(e.key==='Enter') add(); }));
  r.append(l1,l2,b); c.append(r);

  const adj = el('div','card');
  adj.append(el('h2',null,'Ajustement'), el('p','muted','Pour corriger le total sans toucher à la liste (dons en espèces, erreur…). Peut être négatif.'));
  const ra = el('div','row'); const la = el('label','n','Ajustement (€)'); const ai = el('input'); ai.inputMode='decimal'; ai.value=String(num(data.ajustement)); la.append(ai);
  const ba = el('button','ghost','Enregistrer l’ajustement'); ba.type='button';
  ba.onclick=()=>{ const v=Math.round(num(ai.value)*100)/100; commit(d=>{ d.ajustement=v; }, 'Ajustement '+v+' €'); };
  ra.append(la,ba); adj.append(ra);

  const lc = el('div','card');
  lc.append(el('h2',null,'Tous les dons'));
  if(!data.dons.length) lc.append(el('p','muted','Aucun don pour l’instant.'));
  const ul = el('ul','list');
  data.dons.slice().reverse().forEach(x=>{
    const li = el('li'); const l = el('div'); l.append(el('div',null,(x.n||'Anonyme')+' · '+eur(num(x.a))));
    if(x.t) l.append(el('div','when',new Date(x.t).toLocaleString('fr-FR',{weekday:'short',hour:'2-digit',minute:'2-digit'})));
    const del = el('button','danger sm','Supprimer'); del.type='button';
    del.onclick=()=>{ if(!del.dataset.armed){ del.dataset.armed='1'; del.textContent='Confirmer'; return; }
      commit(d=>{ d.dons=d.dons.filter(z=>z.id!==x.id); }, 'Suppression du don '+eur(num(x.a))); };
    li.append(l,del); ul.append(li);
  });
  lc.append(ul);
  if(data.dons.length){
    const rz = el('button','danger','Tout remettre à zéro'); rz.type='button'; rz.style.marginTop='1rem';
    rz.onclick=()=>{ if(!rz.dataset.armed){ rz.dataset.armed='1'; rz.textContent='Confirmer : effacer tous les dons et décocher les défis faits'; return; }
      commit(d=>{ d.dons=[]; d.ajustement=0; d.paliers.forEach(p=>p.fait=false); }, 'Remise à zéro'); };
    lc.append(rz);
  }
  const f = document.createDocumentFragment(); f.append(c,adj,lc); return wrapFrag(f);
}
function wrapFrag(f){ const d=el('div'); d.append(f); return d; }

function saveBar(key, label, apply){
  const r = el('div','row'); r.style.marginTop='1rem';
  const b = el('button',null,label); b.type='button';
  b.onclick=async()=>{ const v = draft[key]; if(await commit(d=>apply(d,clone(v)), 'Mise à jour : '+key)){ dirty[key]=false; resetClean(); render(); } };
  const cancel = el('button','ghost','Annuler les modifications'); cancel.type='button'; cancel.disabled=!dirty[key];
  cancel.onclick=()=>{ dirty[key]=false; resetClean(); render(); };
  r.append(b,cancel); if(dirty[key]) r.append(el('span','dirty','Modifications non enregistrées'));
  return r;
}
function mark(key){ if(!dirty[key]){ dirty[key]=true; const t=document.querySelector('.tabs [aria-selected="true"]'); if(t && !t.textContent.endsWith('•')) t.textContent+=' •'; } }

function viewPaliers(){
  const c = el('section','card');
  c.append(el('h2',null,'Paliers'), el('p','muted','Modifie les montants, les textes, coche « Fait » quand un défi est réalisé, puis enregistre. « Final » met le palier en avant.'));
  const P = draft.paliers;
  const counts = {}; P.forEach(p=>{ const m=num(p.montant); counts[m]=(counts[m]||0)+1; });
  const dup = Object.keys(counts).filter(k=>counts[k]>1);
  const w = el('div','warn', dup.length ? 'Plusieurs défis partagent le même montant : '+dup.map(k=>eur(k)).join(', ')+'.' : ''); c.append(w);
  const g = el('div','grid');
  { const hr=el('div','it h'); ['Montant','Défi','','',''].forEach(h=>hr.append(el('div',null,h))); g.append(hr); }
  P.slice().sort((a,b)=>num(a.montant)-num(b.montant)).forEach(p=>{
    const m = el('input'); m.inputMode='decimal'; m.value=String(p.montant); m.setAttribute('aria-label','Montant');
    m.oninput=()=>{ p.montant=num(m.value); mark('paliers'); };
    m.onchange=()=>render();
    const t = el('input','txt'); t.value=p.texte||''; t.setAttribute('aria-label','Défi'); t.oninput=()=>{ p.texte=t.value; mark('paliers'); };
    const f1 = el('label','chk'); const c1 = el('input'); c1.type='checkbox'; c1.checked=!!p.fait; c1.onchange=()=>{ p.fait=c1.checked; mark('paliers'); }; f1.append(c1, document.createTextNode('Fait'));
    const f2 = el('label','chk'); const c2 = el('input'); c2.type='checkbox'; c2.checked=!!p.final; c2.onchange=()=>{ p.final=c2.checked; mark('paliers'); }; f2.append(c2, document.createTextNode('Final'));
    const d = el('button','danger sm del','✕'); d.type='button'; d.setAttribute('aria-label','Supprimer le palier '+(p.texte||''));
    d.onclick=()=>{ draft.paliers=draft.paliers.filter(z=>z!==p); mark('paliers'); render(); };
    const it=el('div','it'); it.append(m,t,f1,f2,d); g.append(it);
  });
  c.append(g);
  const add = el('button','ghost','+ Ajouter un palier'); add.type='button'; add.style.marginTop='.75rem';
  add.onclick=()=>{ const max=P.reduce((s,p)=>Math.max(s,num(p.montant)),0); draft.paliers.push({id:uid('p'),montant:max+50,texte:'Nouveau défi',final:false,fait:false}); mark('paliers'); render(); };
  c.append(add, saveBar('paliers','Enregistrer les paliers',(d,v)=>{ d.paliers=v.filter(p=>String(p.texte||'').trim()); }));
  return c;
}

function viewCarte(){
  const c = el('section','card');
  c.append(el('h2',null,'Défis à la carte'), el('p','muted','Défis payés à l’unité, en plus des paliers.'));
  const g = el('div','grid c');
  { const hr=el('div','it h'); ['Prix','Défi','Note',''].forEach(h=>hr.append(el('div',null,h))); g.append(hr); }
  draft.carte.forEach(k=>{
    const p = el('input'); p.inputMode='decimal'; p.value=String(k.prix); p.setAttribute('aria-label','Prix'); p.oninput=()=>{ k.prix=num(p.value); mark('carte'); };
    const t = el('input'); t.value=k.texte||''; t.setAttribute('aria-label','Défi'); t.oninput=()=>{ k.texte=t.value; mark('carte'); };
    const n = el('input','note'); n.value=k.note||''; n.placeholder='Facultatif'; n.setAttribute('aria-label','Note'); n.oninput=()=>{ k.note=n.value; mark('carte'); };
    const d = el('button','danger sm del','✕'); d.type='button'; d.setAttribute('aria-label','Supprimer '+(k.texte||''));
    d.onclick=()=>{ draft.carte=draft.carte.filter(z=>z!==k); mark('carte'); render(); };
    const it=el('div','it'); it.append(p,t,n,d); g.append(it);
  });
  c.append(g);
  const add = el('button','ghost','+ Ajouter un défi à la carte'); add.type='button'; add.style.marginTop='.75rem';
  add.onclick=()=>{ draft.carte.push({id:uid('c'),prix:10,texte:'Nouveau défi',note:''}); mark('carte'); render(); };
  c.append(add, saveBar('carte','Enregistrer la carte',(d,v)=>{ d.carte=v.filter(k=>String(k.texte||'').trim()); }));
  return c;
}

function viewTextes(){
  const c = el('section','card'); const T = draft.textes;
  c.append(el('h2',null,'Textes et objectif'));
  const l1 = el('label',null,'Phrase d’introduction en haut de la page'); const i1 = el('textarea'); i1.value=T.intro; i1.oninput=()=>{ T.intro=i1.value; mark('textes'); }; l1.append(i1);
  const r = el('div','row'); r.style.marginTop='.75rem';
  const l2 = el('label','n','Objectif (€)'); const i2 = el('input'); i2.inputMode='decimal'; i2.value=String(T.obj); i2.oninput=()=>{ T.obj=num(i2.value); mark('textes'); }; l2.append(i2);
  const l3 = el('label',null,'Texte de la barre d’objectif'); const i3 = el('input'); i3.value=T.objt; i3.oninput=()=>{ T.objt=i3.value; mark('textes'); }; l3.append(i3);
  const l4 = el('label','n','Tranche Mada (€, 0 = masqué)'); const i4 = el('input'); i4.inputMode='decimal'; i4.value=String(T.tranche); i4.oninput=()=>{ T.tranche=num(i4.value); mark('textes'); }; l4.append(i4);
  r.append(l2,l3,l4);
  c.append(l1, r, saveBar('textes','Enregistrer les textes',(d,v)=>{ d.intro=v.intro; d.objectif={montant:v.obj,texte:v.objt}; d.trancheMada=v.tranche; }));
  return c;
}

window.addEventListener('beforeunload', e=>{ if(dirty.paliers||dirty.carte||dirty.textes){ e.preventDefault(); e.returnValue=''; } });

$('tok').addEventListener('keydown', e=>{ if(e.key==='Enter') connect(); });
const t = store.get('cg_token'); if(store.get('cg_repo')) $('repo').value=store.get('cg_repo'); if(store.get('cg_branch')) $('branch').value=store.get('cg_branch');
if(t){ $('tok').value = t; connect(); }
})();
