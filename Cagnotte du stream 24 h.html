<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Cagnotte du stream 24 h</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Familjen+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style id="css">
:root{
  --bg:#ECEAFF; --paper:#FBFAFF; --ink:#16197A; --muted:#565AA3; --rail:#CCC9F3;
  --hot:#E8246A; --sun:#FFD93B; --sun-ink:#16197A; --ok:#0E7A4F;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D0F45; --paper:#161A5C; --ink:#ECEAFF; --muted:#A3A7E6; --rail:#2C3083;
    --hot:#FF5C93; --sun:#FFD93B; --sun-ink:#0D0F45; --ok:#5FE0A6; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D0F45; --paper:#161A5C; --ink:#ECEAFF; --muted:#A3A7E6; --rail:#2C3083;
  --hot:#FF5C93; --sun:#FFD93B; --sun-ink:#0D0F45; --ok:#5FE0A6; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1.0625rem/1.5 "Familjen Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:60rem;margin:0 auto;padding:0 1.25rem}
h1,h2,.num{font-family:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;font-weight:800;line-height:.95;margin:0}
h2{font-size:clamp(2rem,6vw,3rem);margin:3.5rem 0 1rem}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--hot);outline-offset:2px}

/* Hero */
.top{padding:1.5rem 0 0}
.top p{margin:0;color:var(--muted);font-weight:500}
.slab{background:var(--sun);color:var(--sun-ink);margin-top:1rem}
.slab .wrap{display:flex;align-items:flex-end;justify-content:space-between;gap:1rem;flex-wrap:wrap;padding-top:1rem;padding-bottom:1.1rem}
.total{font-family:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;font-weight:900;font-size:clamp(5.5rem,24vw,15rem);line-height:.8;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.slab .side{font-weight:700;font-size:1.125rem;max-width:16rem;padding-bottom:.4rem}
.next{display:grid;grid-template-columns:1fr auto;gap:.25rem 1.5rem;margin:1.5rem 0 0;align-items:baseline}
.next .what{font-size:clamp(1.25rem,3.5vw,1.6rem);font-weight:700;line-height:1.25}
.next .gap{font-family:"Big Shoulders Display",Impact,sans-serif;font-weight:800;font-size:2.25rem;color:var(--hot);white-space:nowrap}
.next .lbl{color:var(--muted);font-size:.95rem;grid-column:1/-1}
.bar{margin-top:2rem}
.bar .track{height:14px;background:var(--rail);border-radius:7px;overflow:hidden}
.bar .fill{height:100%;background:var(--hot);border-radius:7px;width:0;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.bar .legend{display:flex;justify-content:space-between;font-size:.95rem;color:var(--muted);margin-top:.4rem;gap:1rem}
@media (prefers-reduced-motion:reduce){.bar .fill{transition:none}}

.stats{display:flex;flex-wrap:wrap;gap:1rem 2.5rem;margin-top:2rem}
.stats div{min-width:8rem}
.stats .num{font-size:2.5rem;display:block}
.stats span{color:var(--muted);font-size:.95rem}

/* Ladder */
.filters{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1rem}
.filters button{background:transparent;border:2px solid var(--ink);border-radius:999px;padding:.3rem .95rem;cursor:pointer;font-weight:500}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.ladder{list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:4.75rem 22px 1fr auto;column-gap:.85rem;align-items:start}
.row .amt{font-family:"Big Shoulders Display",Impact,sans-serif;font-weight:800;font-size:1.6rem;text-align:right;line-height:1.1;padding:.55rem 0;font-variant-numeric:tabular-nums;color:var(--muted)}
.row .rail{position:relative;align-self:stretch}
.row .rail::before{content:"";position:absolute;left:9px;top:0;bottom:0;width:4px;background:var(--rail)}
.row .rail::after{content:"";position:absolute;left:4px;top:1.05rem;width:14px;height:14px;border-radius:50%;background:var(--bg);border:3px solid var(--rail)}
.row .txt{padding:.75rem 0;line-height:1.35}
.row .tag{padding-top:.8rem;font-size:.85rem;font-weight:700;white-space:nowrap}
.row.on .amt{color:var(--ink)}
.row.on .rail::before{background:var(--hot)}
.row.on .rail::after{background:var(--hot);border-color:var(--hot)}
.row.on .tag{color:var(--hot)}
.row.done .tag{color:var(--ok)}
.row.done .txt{color:var(--muted)}
.row.final .txt{font-weight:700;font-size:1.2rem}
.row.final .amt{color:var(--hot)}
.row.here .amt{color:var(--hot);font-size:1.15rem;padding-top:.75rem}
.row.here .rail::before{background:linear-gradient(var(--hot) 50%,var(--rail) 50%)}
.row.here .rail::after{width:22px;height:22px;left:0;top:.85rem;background:var(--sun);border-color:var(--hot)}
.row.here .txt{font-weight:700;color:var(--hot)}
.row .mark{border:1.5px solid currentColor;background:transparent;border-radius:6px;padding:.1rem .5rem;cursor:pointer;font-size:.8rem;font-weight:700}
.empty{color:var(--muted);padding:1rem 0}

/* À la carte */
.carte{display:grid;grid-template-columns:repeat(auto-fill,minmax(16rem,1fr));gap:1px;background:var(--rail);border:1px solid var(--rail);border-radius:14px;overflow:hidden}
.carte div{background:var(--paper);padding:1rem 1.1rem;display:flex;flex-direction:column;gap:.4rem}
.carte .num{font-size:2rem;color:var(--hot)}
.carte small{color:var(--muted)}
.mada{margin-top:1.25rem;padding:1.1rem 1.25rem;border-left:6px solid var(--sun);background:var(--paper);border-radius:0 12px 12px 0}
.mada strong{font-family:"Big Shoulders Display",Impact,sans-serif;font-size:1.9rem;font-weight:800}

/* Donations */
.dons{list-style:none;padding:0;margin:0}
.dons li{display:flex;justify-content:space-between;gap:1rem;padding:.55rem 0;border-bottom:1px solid var(--rail)}
.dons .a{font-weight:700;white-space:nowrap;display:flex;gap:.75rem;align-items:center}
.dons .x{background:transparent;border:1.5px solid var(--hot);color:var(--hot);border-radius:6px;padding:.1rem .5rem;font-size:.8rem;font-weight:700;cursor:pointer}
.admin button.reset{background:transparent;color:var(--hot);border:2px solid var(--hot);margin-bottom:.75rem}

/* Admin */
.admin{margin-top:3.5rem;background:var(--paper);border:2px dashed var(--muted);border-radius:14px;padding:1.25rem}
.admin h2{margin-top:0;font-size:2rem}
.admin p{margin:.25rem 0 1rem;color:var(--muted)}
.admin form{display:flex;gap:.6rem;flex-wrap:wrap;align-items:flex-end;margin-bottom:1rem}
.admin label{display:flex;flex-direction:column;font-size:.9rem;font-weight:500;gap:.2rem}
.admin input{border:2px solid var(--rail);background:var(--bg);border-radius:8px;padding:.45rem .6rem;min-width:0;width:11rem}
.admin input[type=number]{width:7.5rem}
.admin button{background:var(--ink);color:var(--bg);border:0;border-radius:8px;padding:.55rem 1rem;font-weight:700;cursor:pointer}
.admin button:disabled{opacity:.5;cursor:progress}
.status{min-height:1.5rem;font-weight:500}
footer{color:var(--muted);font-size:.9rem;padding:3rem 0 2.5rem}
@media (max-width:520px){
  .row{grid-template-columns:3.6rem 22px 1fr;column-gap:.6rem}
  .row .amt{font-size:1.3rem}
  .row .tag{grid-column:3;padding:0 0 .6rem;margin-top:-.4rem}
  .next{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div id="app"></div>
<script type="application/json" id="state">{"total":0,"donations":[],"done":[],"updated":1792591894950}</script>
<script id="main">
(function(){
const HEAD = '<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Cagnotte du stream 24 h</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Familjen+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">';
const FINAL = 1000;
const TIERS = [

[300,"Sofian et Salim font un concours de cheesecake au Népal (celui qui en mange le moins paie tout)"],
[310,"Harold se déguise en Batman jusqu’à la fin du stream"],
[320,"Jordan se déguise en Robin jusqu’à la fin du stream"],
[330,"Les 1A Mada distribuent des crêpes pendant 30 min"],

[350,"Harold offre 5 pintes au SG"],
[360,"Un Mada choisi par le public subit 1 semaine de vol d’habits, comme Chizat l’année dernière"],
[375,"Sofian met un bikini et nous fait un striptease"],

[400,"Santoni met son écharpe au SG physique"],
[420,"Les Mada paient les pintes pendant 1 minute"],
[440,"Tanguy envoie un dive jump de 10 m"],
[460,"Mada court un marathon en relais pendant les 24 h"],
[480,"Tous les Mada qui boivent font un tournoi de CC vendredi à 7 h"],
[500,"La voirie fait enfin sa formation voirie sous polonaise"],

[1000,"On pousse le stream à 48 h",true],
[1100,"Balthus se tatoue un B puis un M à gauche de son W"],
[1200,"Mada ouvre un OnlyFans et l’entretient régulièrement"],
[1300,"Tanguy se coupe les locks"],
[1500,"Manon fait une buzzcut"],
[2000,"Salim casse sa Play s’il perd contre le dernier donneur"]
].map((t,i)=>({id:i,amount:t[0],text:t[1],final:!!t[2]}));
const CARTE = [
[50,"Nos 1A vous nettoient la coloc","Et le prix augmente."],
[15,"Nos 1A vous font la pâtisserie de votre choix"],
[10,"Iwan s’habille de la tenue de ton choix pendant 15 min"],
[20,"Un Mada de votre choix saute dans le lac de l’ENS"],
[2,"On vous prête une puff pendant 1 h"],
[15,"Vous venez faire du henné (ce que vous voulez) sur n’importe qui"],
[10,"Vous venez mettre une tarte au Mada de votre choix"]
];

let state;
try{ state = JSON.parse(document.getElementById('state').textContent); }catch(e){ state = {total:0,donations:[],done:[],updated:0}; }
state.total = Number(state.total)||0;
state.donations = Array.isArray(state.donations)?state.donations:[];
state.done = Array.isArray(state.done)?state.done:[];

let filter = 'all', canEdit = false, art = null, busy = false;
const eur = n => Number(n).toLocaleString('fr-FR',{maximumFractionDigits:2})+' €';
const el = (tag, cls, text) => { const e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e; };
const app = document.getElementById('app');

function render(){
  const t = state.total;
  const unlocked = TIERS.filter(x=>t>=x.amount);
  const next = TIERS.find(x=>t<x.amount);
  app.textContent='';

  const top = el('div','top'); const w0 = el('div','wrap');
  w0.append(el('p',null,'Stream 24 h de Mada au profit de l’association Les Enfants du Soleil. Chaque palier atteint, on le fait en live.'));
  top.append(w0); app.append(top);

  const slab = el('section','slab'); slab.setAttribute('aria-label','Montant récolté');
  const ws = el('div','wrap');
  const big = el('div','total', eur(t));
  ws.append(big, el('div','side','récoltés pour l’instant'));
  slab.append(ws); app.append(slab);

  const main = el('main','wrap');
  const nx = el('div','next');
  if(next){
    nx.append(el('div','what',next.text), el('div','gap','encore '+eur(+(next.amount-t).toFixed(2))));
    nx.append(el('div','lbl','Prochain palier à '+eur(next.amount)));
  } else {
    nx.append(el('div','what','Tous les paliers sont débloqués. Merci à vous !'));
  }
  main.append(nx);

  const bar = el('div','bar'); const tr = el('div','track'); const fill = el('div','fill');
  tr.setAttribute('role','progressbar'); tr.setAttribute('aria-valuemin','0'); tr.setAttribute('aria-valuemax',String(FINAL)); tr.setAttribute('aria-valuenow',String(Math.min(t,FINAL)));
  tr.setAttribute('aria-label','Progression vers le stream de 48 h');
  tr.append(fill); bar.append(tr);
  const lg = el('div','legend'); lg.append(el('span',null, t>=FINAL ? 'Le stream passe à 48 h !' : 'Objectif : pousser le stream à 48 h'), el('span',null,eur(FINAL)));
  bar.append(lg); main.append(bar);
  requestAnimationFrame(()=>{ fill.style.width = Math.min(100,t/FINAL*100)+'%'; });

  const stats = el('div','stats');
  const s1 = el('div'); s1.append(el('span','num',unlocked.length+' / '+TIERS.length), el('span',null,'paliers débloqués'));
  const s2 = el('div'); s2.append(el('span','num',String(state.done.filter(id=>TIERS[id]).length)), el('span',null,'défis déjà faits'));
  stats.append(s1,s2);
  main.append(stats);

  // Ladder
  main.append(el('h2',null,'Les paliers'));
  const fl = el('div','filters'); fl.setAttribute('role','group'); fl.setAttribute('aria-label','Filtrer les paliers');
  [['all','Tous'],['on','Débloqués'],['off','À débloquer']].forEach(([k,l])=>{
    const b = el('button',null,l); b.type='button'; b.setAttribute('aria-pressed',String(filter===k));
    b.onclick=()=>{ filter=k; render(); document.querySelector('.filters button[aria-pressed="true"]')?.focus(); };
    fl.append(b);
  });
  main.append(fl);
  const ul = el('ol','ladder');
  let prevAmt = null, hereShown = false;
  const list = TIERS.filter(x=> filter==='all' || (filter==='on' ? t>=x.amount : t<x.amount));
  list.forEach(x=>{
    if(filter==='all' && !hereShown && t<x.amount){
      hereShown = true;
      const h = el('li','row here'); h.append(el('div','amt',eur(t)), el('div','rail'), el('div','txt','Vous êtes ici'), el('div','tag',''));
      ul.append(h); prevAmt = null;
    }
    const on = t>=x.amount, done = state.done.includes(x.id);
    const li = el('li','row'+(on?' on':'')+(done?' done':'')+(x.final?' final':''));
    li.append(el('div','amt', x.amount===prevAmt ? '' : eur(x.amount)), el('div','rail'));
    li.append(el('div','txt', x.final ? x.text+' (objectif final)' : x.text));
    const tag = el('div','tag');
    if(canEdit && on){
      const b = el('button','mark', done?'Fait ✓':'Marquer fait'); b.type='button';
      b.setAttribute('aria-pressed',String(done));
      b.onclick=()=>commit(s=>{ s.done = done ? s.done.filter(i=>i!==x.id) : s.done.concat(x.id); });
      tag.append(b);
    } else tag.textContent = done ? 'Fait ✓' : (on ? 'Débloqué' : '');
    li.append(tag); ul.append(li); prevAmt = x.amount;
  });
  if(!list.length) ul.append(el('li','empty', filter==='on' ? 'Aucun palier débloqué pour l’instant. Le premier est à 1 € !' : 'Tous les paliers sont débloqués.'));
  main.append(ul);

  // À la carte
  main.append(el('h2',null,'Défis à la carte'));
  main.append(el('p',null,'Payez le prix indiqué et le défi est pour vous, en plus des paliers.'));
  const c = el('div','carte');
  CARTE.forEach(([p,txt,note])=>{ const d=el('div'); d.append(el('span','num',eur(p)), el('span',null,txt)); if(note) d.append(el('small',null,note)); c.append(d); });
  main.append(c);
  const m = el('div','mada');
  m.append(el('div',null,'Cagnotte Mada : à la fin du stream, chaque Mada donne 1 € pour chaque tranche de 50 € récoltée.'));
  const mm = el('div'); mm.append(el('strong',null,eur(Math.floor(t/50))), document.createTextNode(' par Mada pour l’instant'));
  m.append(mm); main.append(m);

  if(state.donations.length){
    main.append(el('h2',null,'Derniers dons'));
    const dl = el('ul','dons');
    state.donations.forEach((d,i)=>{ const li=el('li'); const right=el('span','a',eur(d.a));
      if(canEdit){ const x=el('button','x','Supprimer'); x.type='button'; x.setAttribute('aria-label','Supprimer le don de '+(d.n||'Anonyme')+' ('+eur(d.a)+')');
        x.onclick=()=>commit(s=>{ const g=s.donations[i]; if(!g) return; s.donations.splice(i,1); s.total=Math.max(0,Math.round((s.total-(Number(g.a)||0))*100)/100); });
        right.append(x); }
      li.append(el('span',null,d.n||'Anonyme'), right); dl.append(li); });
    main.append(dl);
  }

  if(canEdit) main.append(adminPanel());

  const f = el('footer');
  f.textContent = state.updated ? 'Mis à jour le '+new Date(state.updated).toLocaleString('fr-FR',{weekday:'long',hour:'2-digit',minute:'2-digit'})+'. La page se met à jour toute seule.' : 'La page se met à jour toute seule dès qu’un don est ajouté.';
  main.append(f);
  app.append(main);
}

function adminPanel(){
  const a = el('section','admin'); a.setAttribute('aria-label','Espace orga');
  a.append(el('h2',null,'Espace orga'), el('p',null,'Visible seulement par les orgas. Chaque modification met à jour la page pour tout le monde.'));
  const f1 = el('form');
  const l1 = el('label',null,'Pseudo'); const n = el('input'); n.placeholder='Anonyme'; n.maxLength=40; l1.append(n);
  const l2 = el('label',null,'Montant (€)'); const v = el('input'); v.type='number'; v.min='0.01'; v.step='0.01'; v.required=true; l2.append(v);
  const b1 = el('button',null,'Ajouter le don'); b1.type='submit';
  f1.append(l1,l2,b1);
  f1.onsubmit = e=>{ e.preventDefault(); const amt=parseFloat(v.value); if(!(amt>0)) return setStatus('Indiquez un montant supérieur à 0.');
    const name = n.value.trim().slice(0,40);
    commit(s=>{ s.total = Math.round((s.total+amt)*100)/100; s.donations = [{n:name,a:amt}].concat(s.donations).slice(0,12); }); };
  const f2 = el('form');
  const l3 = el('label',null,'Total exact (€)'); const tv = el('input'); tv.type='number'; tv.min='0'; tv.step='0.01'; tv.value=String(state.total); l3.append(tv);
  const b2 = el('button',null,'Corriger le total'); b2.type='submit';
  f2.append(l3,b2);
  f2.onsubmit = e=>{ e.preventDefault(); const val=parseFloat(tv.value); if(!(val>=0)) return setStatus('Indiquez un total valide.'); commit(s=>{ s.total=Math.round(val*100)/100; }); };
  const st = el('div','status'); st.id='status'; st.setAttribute('role','status');
  const rz = el('button','reset','Tout remettre à zéro'); rz.type='button';
  rz.onclick=()=>{ if(rz.dataset.armed){ commit(s=>{ s.total=0; s.donations=[]; s.done=[]; }); } else { rz.dataset.armed='1'; rz.textContent='Confirmer : effacer tous les dons et remettre le total à 0 €'; setStatus('Cliquez une seconde fois pour confirmer.'); } };
  a.append(f1,f2,rz,st);
  return a;
}
function setStatus(m){ const s=document.getElementById('status'); if(s) s.textContent=m; }

function buildDoc(s){
  const css = document.getElementById('css').textContent;
  const js = document.getElementById('main').textContent;
  const json = JSON.stringify(s).replace(/</g,'\\u003c');
  const S = 'script';
  return '<!doctype html>\n<html lang="fr">\n<head>\n'+HEAD+'\n<style id="css">'+css+'</style>\n</head>\n<body>\n<div id="app"></div>\n<'+S+' type="application/json" id="state">'+json+'</'+S+'>\n<'+S+' id="main">'+js+'</'+S+'>\n</body>\n</html>\n';
}

async function commit(mut){
  if(busy) return;
  if(!art){ setStatus('Enregistrement impossible depuis cette vue : ouvrez la page dans claude.ai avec un compte orga.'); return; }
  const s = JSON.parse(JSON.stringify(state)); mut(s); s.updated = Date.now();
  busy = true; document.querySelectorAll('.admin button,.mark').forEach(b=>b.disabled=true); setStatus('Enregistrement…');
  try{ await art.publish(buildDoc(s)); setStatus('Enregistré.'); }
  catch(e){
    const c = e && e.code;
    setStatus(c==='conflict' ? 'Un autre orga vient de modifier la page : elle se recharge, refaites votre ajout si besoin.'
      : (c==='not_granted'||c==='not_writer') ? 'Votre compte ne peut pas modifier cette page.'
      : 'Enregistrement refusé ('+(c||'erreur inconnue')+'). Réessayez.');
  }
  busy = false; document.querySelectorAll('.admin button,.mark').forEach(b=>b.disabled=false);
}

render();
if(window.claude && typeof window.claude.use==='function'){
  window.claude.use('user').then(async u=>{
    try{ if(u && await u.canEdit()){ canEdit = true; render(); } }catch(e){}
  });
  window.claude.use('artifact').then(a=>{ art = a; });
}
})();
</script>
